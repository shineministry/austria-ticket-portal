services:
  - type: web
    name: austria-ticket-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PASSCODE
        generateValue: true
      - key: BASE_PATH
        value: ""
    # Free plan has an ephemeral disk: uploads survive until the next
    # redeploy/restart. For persistent uploads, upgrade to a paid plan and
    # uncomment the disk block below (and set DATA_DIR=/var/data).
    # disk:
    #   name: portal-data
    #   mountPath: /var/data
    #   sizeGB: 1
